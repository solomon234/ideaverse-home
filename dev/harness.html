<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ideaverse harness</title>
<link rel="stylesheet" href="/styles.css">
<style>html,body{margin:0;height:100%;background:#000}#root{position:fixed;inset:0}</style></head>
<body><div id="root"></div>
<script src="/ui.js"></script>
<script>
  // stands in for Obsidian: records what the plugin would do
  window.__log = { opened: [], status: [] };
  const mem = {};
  const api = {
    open: p => window.__log.opened.push(p),
    completeLever: async r => { (window.__log.levers = window.__log.levers || []).push(r); return true; },
    claudeRun: async (k, p) => { (window.__log.claude = window.__log.claude || []).push([k, p]); await new Promise(r => setTimeout(r, 300)); return k === 'log' ? { ok: true, mode: 'background', draft: true, text: '**2026-10-23 (test)** — Draft\n- Built: x\n---' } : { ok: true, mode: 'background', text: 'A stand-in answer for ' + k }; },
    claudeCancel: () => {},
    appendLog: async t => { (window.__log.appended = window.__log.appended || []).push(t); return true; },
    addTodo: async (t, x) => { (window.__log.todos = window.__log.todos || []).push([t, x]); return true; },
    capture: async x => { (window.__log.captures = window.__log.captures || []).push(x); return true; },
    createEffort: async n => { (window.__log.created = window.__log.created || []).push(n); return ''; },
    logMeeting: async m => { (window.__log.meetings = window.__log.meetings || []).push(m); return true; },
    archiveEffort: async f => { window.__log.archived = (window.__log.archived || []).concat(f); return true; },
    restoreEffort: async f => true,
    setProposalStatus: async (p, s) => { const prev = mem[p] || 'pending'; mem[p] = s; window.__log.status.push([p, s]); return prev; }
  };
  window.__ui = IdeaverseUI.mount(document.getElementById('root'), api);
  fetch('/api/data').then(r => r.json()).then(d => { window.__data = d; window.__ui.update(d); window.__ready = true; });
</script></body></html>
